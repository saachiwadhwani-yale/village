[pytest]
testpaths = tests
asyncio_mode = auto
# One event loop for the whole run: the model client keeps connections that belong to the loop
# that opened them (the real app also runs on a single loop).
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session
markers =
    live: calls gpt-6-luna through Portkey (needs PORTKEY_API_KEY)
